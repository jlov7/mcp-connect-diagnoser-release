name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uvx --from ruff==0.17.1 ruff check src tests scripts examples
  core-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: sh scripts/verify-release.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
  native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - name: Install locked optional SDK dependencies
        run: |
          mkdir -p .release-scratch
          uv sync --frozen --project tests/sdk
          npm install --prefix .release-scratch/npm --ignore-scripts --no-audit --no-fund npm@12.0.0
          node .release-scratch/npm/node_modules/npm/bin/npm-cli.js ci --prefix tests/sdk --ignore-scripts --no-audit --no-fund
      - name: Native 168-request gate and offline verification
        run: |
          export SDK_PYTHON="$PWD/tests/sdk/.venv/bin/python"
          export NODE_BIN="$(command -v node)"
          export NATIVE_OUTPUT="$PWD/.release-scratch/native.json"
          sh scripts/verify-native.sh
